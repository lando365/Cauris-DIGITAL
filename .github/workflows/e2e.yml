name: Tests E2E sur preview Vercel

# CDC V2 §12.4 : "Les tests E2E s'exécutent sur l'URL de preview Vercel dans
# la pipeline CI."
#
# Ce workflow attend la notification de déploiement que l'intégration
# GitHub de Vercel publie automatiquement (événement `deployment_status`)
# pour chaque Preview, puis fait tourner la suite Playwright directement
# contre cette URL déployée — pas contre un serveur local. playwright.config.ts
# gère déjà ce cas : si PLAYWRIGHT_BASE_URL est défini, aucun `next start`
# local n'est lancé.
#
# Prérequis :
#   - Le projet doit être connecté à Vercel via l'app GitHub officielle
#     (c'est elle qui émet les événements `deployment_status`, pas ce repo).
#   - Secrets requis sur ce dépôt (Settings > Secrets and variables > Actions) :
#       SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD — identifiants d'un compte
#       ADMIN qui existe réellement dans la base pointée par le déploiement
#       preview (généralement la même base que le développement, sauf
#       variables d'environnement Vercel spécifiques par branche).
#
# Déclenchement manuel possible (onglet Actions > Run workflow) en fournissant
# une URL de preview directement, utile pour rejouer la suite sans repousser
# de commit.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL de preview à tester (sinon, dernier déploiement Preview détecté)'
        required: false

permissions:
  contents: read

jobs:
  e2e:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Déterminer l'URL de preview à tester
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.preview_url }}" ]; then
            echo "url=${{ github.event.inputs.preview_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.deployment_status.environment_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lancer la suite Playwright contre la preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: npx playwright test

      - name: Publier les traces Playwright (en cas d'échec)
        # reporter: 'list' (playwright.config.ts) n'écrit pas de rapport HTML ;
        # ce sont les traces (trace: 'retain-on-failure') dans test-results/
        # qui contiennent l'info utile, ouvrables via `npx playwright show-trace`.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
